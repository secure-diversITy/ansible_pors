---

- name: "Save current state"
  ansible.builtin.shell: |
    cd {{ splunk_installation.splunk_home_path }}/etc/{{ item.key | replace('shcluster_apps', 'shcluster/apps') | replace('_', '-') }}/{{ app_name }} >> /dev/null 2>&1 || exit 0
    git add -A . && git stash save befreset-$(date +%F_%T)
  args:
    executable: /bin/bash
  with_dict: "{{ vars[app_variable] }}"

- name: "Clone/update app repository"
  ansible.builtin.git:
    repo: "{{ item.value.git_repo | regex_replace('^https://', 'https://' + vault_git_ro_user + ':' + vault_git_ro_token + '@') }}"
    dest: "{{ splunk_installation.splunk_home_path }}/etc/{{ item.key | replace('shcluster_apps', 'shcluster/apps') | replace('_', '-') }}/{{ app_name }}"
    version: "{{ git_default_branch_override | default(item.value.git_version) }}"
    clone: yes
    update: yes
    force: yes
    accept_hostkey: yes
  with_dict: "{{ vars[app_variable] }}"
