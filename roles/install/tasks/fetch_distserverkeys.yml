- name: "Fetch distServerKeys from all Servers"
  ansible.builtin.fetch:
    src: "{{ splunk_installation.splunk_home_path }}/etc/auth/distServerKeys/trusted.pem"
    dest: "{{ splunk_repository.repository_root }}/distServerKeys/{{ inventory_hostname_short }}/trusted.pem"
    flat: yes
    fail_on_missing: yes
