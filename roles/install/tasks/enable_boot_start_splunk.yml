- name: "Enable Splunk boot-start (systemd)"
  shell: |
    {{ splunk_installation.splunk_home_path }}/bin/splunk enable boot-start -user {{ splunk_install_user }} --answer-yes --accept-license --no-prompt -systemd-managed 1 -systemd-unit-file-name {{ splunk_systemd_unit_name }} -create-polkit-rules 1
  register: enableinit
  failed_when: enableinit.rc != 0 and enableinit.rc != 8

- name: "Identify systemd version"
  ansible.builtin.shell: systemctl --version | head -1 | awk '{ print $2}'
  register: systemd_version

- name: "Replace legacy systemd options"
  block:

    - name: "Remove"
      community.general.ini_file:
        path: "/etc/systemd/system/{{ splunk_systemd_unit_name }}.service"
        section: Service
        option: "{{ item }}"
        state: absent
      loop:
        - CPUShares
        - MemoryLimit

    - name: "Calc max mem (incl 4G buffer)"
      ansible.builtin.set_fact:
        sysd_maxmem: >-
          {% if ansible_memtotal_mb < 4096 %}{{ ansible_memtotal_mb}}{% else %}{{ ansible_memtotal_mb - 4096 }}{% endif %}

    - name: "Add"
      community.general.ini_file:
        path: "/etc/systemd/system/{{ splunk_systemd_unit_name }}.service"
        section: Service
        option: "{{ item.o }}"
        value: "{{ item.v }}"
        state: present
        no_extra_spaces: true
      loop:
        - { o: 'CPUWeight', v: 1024 }
        - { o: 'MemoryMax', v: "{{ sysd_maxmem }}M" }

  when: systemd_version.stdout | int >= 252

- name: "Protect splunk's systemd service"
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ splunk_systemd_unit_name }}.service"
    attr: +i

- name: "Enable splunk's systemd service"
  ansible.builtin.systemd_service:
    enabled: yes
    daemon_reload: true
    name: "{{ splunk_systemd_unit_name }}"
  when: 
    - "run_in_docker.rc == 1"
