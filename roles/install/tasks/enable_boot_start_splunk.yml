---

- name: "Check init/systemd conf files"
  block:

    - stat:
        path: /etc/init.d/splunk
      register: splunkinitfile

    - stat:
        path: "/etc/systemd/system/{{ splunk_systemd_unit_name }}.service"
      register: splunksysdfile

- name: "Remove legacy initd script"
  block:

    - name: "Stop splunk's initd service"
      ansible.builtin.systemd_service:
        name: splunk
        state: stopped

    # file attr doesnt work and is available in ansible version >= v2.3 only
    - name: Remove protection from splunk init.d script
      shell: chattr -i /etc/init.d/splunk
      when: 
        - splunkinitfile is defined and splunkinitfile.stat.exists
        - run_in_docker.rc == 1

    - name: Remove an existing init.d script
      file: path=/etc/init.d/splunk
            state=absent

    - name: "Reload systemd conf"
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: run_in_docker.rc == 1

  when: splunkinitfile is defined and splunkinitfile.stat.exists

- name: "Show splunk version"
  debug:
    msg: "splunk version is: >{{ splunkversionnum }}<"
    
- name: "Prep splunk-launch.conf"
  copy:
    remote_src: true
    src: "{{ splunk_installation.splunk_home_path }}/etc/splunk-launch.conf.default"
    dest: "{{ splunk_installation.splunk_home_path }}/etc/splunk-launch.conf"
    owner: "{{ splunk_install_user }}"
    group: "{{ splunk_install_user }}"

- name: "Unprotect splunk's systemd service"
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ splunk_systemd_unit_name }}.service"
    attr: -i
  when: splunksysdfile is defined and splunksysdfile.stat.exists

- name: "Disable boot start"
  shell: |
    {{ splunk_installation.splunk_home_path }}/bin/splunk disable boot-start
    {{ splunk_installation.splunk_home_path }}/bin/splunk disable boot-start --no-prompt -systemd-managed 1 -systemd-unit-file-name {{ splunk_systemd_unit_name }}
  when: splunk_upgrade

