---

- name: "Check if splunk web is enabled"
  ansible.builtin.shell: '{{ splunk_installation.splunk_home_path }}/bin/splunk btool web list settings |grep startwebserver | grep -E -io "true|1|yes|enabled"'
  register: web_on
  ignore_errors: true
  changed_when: web_on.rc == 0


- name: "Check if SSL is enabled on splunk web"
  ansible.builtin.shell: '{{ splunk_installation.splunk_home_path }}/bin/splunk btool web list settings |grep enableSplunkWebSSL | grep -E -io "true|1|yes|enabled"'
  register: web_ssl_on
  ignore_errors: true
  changed_when: web_ssl_on.rc == 0
  when: web_on.changed
