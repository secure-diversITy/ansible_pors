---

- name: "WEB: backup existing certificate"
  ansible.builtin.shell: >-
    cp "{{ splunk_installation.splunk_home_path }}/etc/auth/{{ item }}" "{{ splunk_installation.splunk_home_path }}/etc/auth/{{ item }}-bak-$(date +%F_%s)"
  loop:
    - server.pem

- name: "WEB: renew certificate"
  shell: "{{ splunk_installation.splunk_home_path }}/bin/splunk createssl web-cert -n $(hostname -f) -l 4096"
  args:
    chdir: "{{ splunk_installation.splunk_home_path }}/etc/auth/splunkweb"
  notify: splunk restart
