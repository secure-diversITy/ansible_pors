---
# HINT: The "hosts" value here is a dynamic group name used in PORS

- name: "Configure a splunk shcmember"
  hosts: "{{ target }}"
  remote_user: "{{ pors_ssh_user }}"
  become: yes
  become_user: "{{ splunk_install_user }}"

  vars:
    splunk_restart: True

  tasks:
    - include_role:
        name: conf/ldap

    - include_role:
        name: system_sshid

    - include_role:
        name: conf/web

    - include_role:
        name: conf/outputs

    - include_role:
        name: conf/server

    - include_role:
        name: group/shcmember

  # flush notify handlers to force-activate the splunk config -now-
  post_tasks:
    - meta: flush_handlers

- name: "Deploy keys (peernode)"
  hosts: "{{ target }}"
  remote_user: "{{ pors_ssh_user }}"
  become: yes
  become_user: "{{ splunk_install_user }}"

  vars:
    parsed_groups: "peernode"
    splunk_restart: True

  tasks:
    - include_role:
        name: group/searchhead

  # flush notify handlers to force-activate the splunk config
  post_tasks:
    - meta: flush_handlers

